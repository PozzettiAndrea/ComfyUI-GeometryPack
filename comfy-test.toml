[test]
levels = ["syntax", "coverage", "install", "javascript", "registration", "instantiation", "execution"]
publish = true

[test.workflows]
# 600, not 300: remeshing_all legitimately needs ~260s on bare metal
# (windows-portable-cuda) and >300s inside the Windows Sandbox VM
# (GeometryPack-2144 timed out at 300s mid-QuadriFlow).
timeout = 600
cpu = { exclude = ["fill_holes_all", "remeshing_all", "uv_unwrap_all", "_coverage_probes"] }
cuda = { include = ["fill_holes_all", "remeshing_all", "uv_unwrap_all"] }

[test.lanes]
lanes = ["linux-cpu", "macos-cpu", "windows-cpu", "windows-portable-cpu", "macos-desktop", "windows-desktop", "linux-cuda", "windows-cuda", "windows-portable-cuda", "windows-desktop-cuda"]