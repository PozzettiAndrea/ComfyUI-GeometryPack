[test]
levels = ["syntax", "coverage", "install", "javascript", "registration", "instantiation", "execution"]
publish = true

[test.workflows]
# 600, not 300: remeshing_all legitimately needs ~260s on bare metal
# (windows-portable-cuda) and >300s inside the Windows Sandbox VM
# (GeometryPack-2144 timed out at 300s mid-QuadriFlow).
timeout = 600
cpu = [
    "!fill_holes_all",
    "!remeshing_all",
    "!uv_unwrap_all",
]
cuda = [
    "fill_holes_all",
    "remeshing_all",
    "uv_unwrap_all",
]

[test.platforms]
platforms = ["linux", "macos", "windows", "windows_portable", "macos_desktop", "windows_desktop", "linux_cuda", "windows_cuda", "windows_portable_cuda", "windows_desktop_cuda"]